name: Test and package Siri
on:
  workflow_dispatch:
  push:
    branches: ['arena/0c07e6cf-siri-for-windows']
    paths-ignore: ['README.md', 'docs/**']
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate native PowerShell syntax
        shell: powershell
        run: ./tools/check-native.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native domain checks
        run: dotnet run --project native/tests/NativeChecks.csproj --configuration Release
      - name: Publish self-contained native Windows executable
        shell: pwsh
        run: |
          dotnet publish native/SiriNative.csproj --configuration Release --runtime win-x64 --self-contained true --output native-artifacts *> native-build.log
          $code = $LASTEXITCODE
          Get-Content native-build.log
          if ($code -ne 0) {
            Get-Content native-build.log | Where-Object { $_ -match ': error ' } | ForEach-Object { Write-Output "::error::$_" }
            exit $code
          }
      - name: Verify single-file package
        shell: pwsh
        run: |
          if (!(Test-Path native-artifacts/Siri-for-Windows.exe)) { throw 'Missing native EXE' }
          if (Get-ChildItem native-artifacts -Filter *.dll) { throw 'Expected bundled libraries, found external DLLs' }
      - name: Launch native UI with voice activation off
        shell: powershell
        run: |
          try { ./tools/check-native-app.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message)"
            Write-Output "::error::$($_.ScriptStackTrace)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Siri-for-Windows-Native-exe
          path: native-artifacts/*.exe
          if-no-files-found: error
      - name: Publish direct EXE download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "native-v3.1-build${{ github.run_number }}"
          gh release create $tag native-artifacts/Siri-for-Windows.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Siri for Windows 3.1 — native Windows EXE" --notes "Download Siri-for-Windows.exe directly below. Native WPF, not Electron. Rounded windows, explicit local model selection, Hey Siri bubble, and opt-in Windows Settings Apps integration. Requires local Ollama for AI; voice requires English Windows speech recognition and explicit microphone opt-in. Unsigned community software. No custom Windows Settings navigation page or closed-app wake service." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Siri-Android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
