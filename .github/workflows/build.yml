name: Test and package Siri
on:
  workflow_dispatch:
  push:
    branches: ['arena/0c07e6cf-siri-for-windows']
    paths-ignore: ['README.md', 'docs/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate native PowerShell syntax
        shell: powershell
        run: ./tools/check-native.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native domain checks
        run: dotnet run --project native/tests/NativeChecks.csproj --configuration Release
      - name: Publish self-contained native Windows executable
        run: dotnet publish native/SiriNative.csproj --configuration Release --runtime win-x64 --self-contained true --output native-artifacts
      - name: Verify single-file package
        shell: pwsh
        run: |
          if (!(Test-Path native-artifacts/Siri-for-Windows.exe)) { throw 'Missing native EXE' }
          if (Get-ChildItem native-artifacts -Filter *.dll) { throw 'Expected bundled libraries, found external DLLs' }
      - uses: actions/upload-artifact@v4
        with:
          name: Siri-for-Windows-Native-exe
          path: native-artifacts/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Siri-Android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
